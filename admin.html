<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOORÉ — Product Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #faf7f3;
            --white: #ffffff;
            --dark: #211b18;
            --text: #403733;
            --muted: #80756f;
            --accent: #9a735f;
            --border: #e7dfd8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "DM Sans", sans-serif;
            line-height: 1.6;
        }

        .container {
            width: min(92%, 1100px);
            margin: auto;
        }

        header {
            background: var(--dark);
            color: white;
            padding: 22px 0;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-family: "Cormorant Garamond", serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        .back-link {
            color: white;
            text-decoration: none;
            font-size: 13px;
        }

        main {
            padding: 55px 0;
        }

        .heading {
            margin-bottom: 35px;
        }

        .label {
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        h1 {
            margin-top: 8px;
            font-family: "Cormorant Garamond", serif;
            font-size: 55px;
            color: var(--dark);
            line-height: 1;
        }

        .intro {
            margin-top: 12px;
            color: var(--muted);
        }

        .admin-box {
            background: white;
            border: 1px solid var(--border);
            padding: 35px;
            margin-bottom: 40px;
        }

        .admin-box h2 {
            font-family: "Cormorant Garamond", serif;
            font-size: 34px;
            color: var(--dark);
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 12px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            background: var(--bg);
            font-family: inherit;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: var(--accent);
        }

        .btn {
            margin-top: 25px;
            padding: 14px 25px;
            border: 0;
            background: var(--dark);
            color: white;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .btn:hover {
            background: var(--accent);
        }

        .product-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product-card {
            background: white;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .product-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
        }

        .product-info {
            padding: 20px;
        }

        .product-category {
            color: var(--accent);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .product-info h3 {
            margin: 6px 0;
            font-family: "Cormorant Garamond", serif;
            font-size: 27px;
        }

        .price {
            font-weight: 700;
            margin-bottom: 15px;
        }

        .delete-btn {
            padding: 9px 14px;
            border: 1px solid #ddd;
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
        }

        .delete-btn:hover {
            background: var(--dark);
            color: white;
        }

        .note {
            margin-top: 15px;
            padding: 15px;
            background: #f1e9e2;
            color: var(--muted);
            font-size: 12px;
        }

        @media (max-width: 700px) {

            h1 {
                font-size: 43px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .product-list {
                grid-template-columns: 1fr;
            }

            .admin-box {
                padding: 22px;
            }

            .header-inner {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="container header-inner">

        <div class="logo">
            NOORÉ
        </div>

        <a
            href="index.html"
            class="back-link">
            ← Back to Website
        </a>

    </div>
</header>


<main>

<div class="container">

    <div class="heading">

        <span class="label">
            ADMIN PANEL
        </span>

        <h1>
            Manage Your <em>Collection.</em>
        </h1>

        <p class="intro">
            Add and manage products for your boutique website.
        </p>

    </div>


    <!-- ADD PRODUCT -->

    <div class="admin-box">

        <h2>
            Add New Product
        </h2>

        <form id="productForm">

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Example: Floral Kurti"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Price
                    </label>

                    <input
                        type="text"
                        id="productPrice"
                        placeholder="Example: ₹1,499"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <select id="productCategory" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="dresses">
                            Dresses
                        </option>

                        <option value="ethnic">
                            Ethnic Wear
                        </option>

                        <option value="kurtis">
                            Kurtis
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Image URL
                    </label>

                    <input
                        type="url"
                        id="productImage"
                        placeholder="Paste product image URL"
                        required>

                </div>

            </div>


            <button
                type="submit"
                class="btn">

                + Add Product

            </button>

        </form>


        <div class="note">
            💡 Enter the product name, price, category and image URL,
            then click <strong>Add Product</strong>.
        </div>

    </div>


    <!-- PRODUCT LIST -->

    <div class="admin-box">

        <h2>
            Current Products
        </h2>

        <div
            class="product-list"
            id="productList">

            <!-- Products will appear here -->

        </div>

    </div>

</div>

</main>


<script>

const form = document.getElementById("productForm");
const productList = document.getElementById("productList");

let products =
    JSON.parse(localStorage.getItem("nooreProducts")) || [];


function saveProducts() {

    localStorage.setItem(
        "nooreProducts",
        JSON.stringify(products)
    );

}


function displayProducts() {

    productList.innerHTML = "";

    if (products.length === 0) {

        productList.innerHTML = `
            <p style="color:#80756f;">
                No products added yet.
            </p>
        `;

        return;
    }


    products.forEach((product, index) => {

        const card = document.createElement("div");

        card.className = "product-card";

        card.innerHTML = `

            <img
                src="${product.image}"
                alt="${product.name}">

            <div class="product-info">

                <div class="product-category">
                    ${product.category}
                </div>

                <h3>
                    ${product.name}
                </h3>

                <div class="price">
                    ${product.price}
                </div>

                <button
                    class="delete-btn"
                    onclick="deleteProduct(${index})">

                    Delete Product

                </button>

            </div>
        `;

        productList.appendChild(card);

    });

}


form.addEventListener("submit", function(event) {

    event.preventDefault();


    const product = {

        name:
            document.getElementById("productName").value,

        price:
            document.getElementById("productPrice").value,

        category:
            document.getElementById("productCategory").value,

        image:
            document.getElementById("productImage").value

    };


    products.push(product);

    saveProducts();

    displayProducts();

    form.reset();

    alert("Product added successfully!");


});


function deleteProduct(index) {

    products.splice(index, 1);

    saveProducts();

    displayProducts();

}


displayProducts();

</script>

</body>
</html>
